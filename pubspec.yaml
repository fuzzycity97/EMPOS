name: empos
description: "Cross-platform Enterprise POS & ERP system migrated to Flutter with Clean Architecture and BLoC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ============================================================================
  # 1. State Management & Architecture (BLoC & Clean Architecture)
  # ============================================================================
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  dartz: ^0.10.1

  # ============================================================================
  # 2. Responsive Layout & Adaptive Multi-Platform UI
  # ============================================================================
  responsive_builder: ^0.7.1
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.9
  fl_chart: ^0.70.2
  data_table_2: ^2.5.15

  # ============================================================================
  # 3. Networking, WebSockets & Sync Engine (Cross-Platform)
  # ============================================================================
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.2
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.0
  connectivity_plus: ^6.1.3

  # ============================================================================
  # 4. Storage & Offline-First Persistence (Web, Windows, Mobile compatible)
  # ============================================================================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # ============================================================================
  # 5. POS Hardware, Printing & Export Utilities
  # ============================================================================
  pdf: ^3.11.2
  printing: ^5.13.4
  qr_flutter: ^4.1.0
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^8.1.7
  audioplayers: ^6.1.2

  # ============================================================================
  # 6. Core Utilities
  # ============================================================================
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/teeth/
